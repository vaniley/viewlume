[package]
name = "viewlume"
version = "0.2.1"
edition = "2021"
authors = ["vaniley"]
description = "A fast, GPU-accelerated image viewer with fluid navigation"
license = "MIT"
repository = "https://github.com/vaniley/viewlume"
homepage = "https://github.com/vaniley/viewlume"
readme = "README.md"
keywords = ["image-viewer", "graphics", "egui", "wgpu", "desktop"]
categories = ["multimedia::images", "gui"]
publish = false

[dependencies]
# GUI and Rendering
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = { version = "0.29", features = ["default_fonts"] }

# Image Decoding and Processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "dds",
    "exr",
    "ff",
    "hdr",
    "ico",
    "pnm",
    "tiff",
    "tga",
    "qoi",
] }
fast_image_resize = { version = "5", features = ["rayon"] }
kamadak-exif = "0.5"

# Concurrency and Data Structures
crossbeam-channel = "0.5"
quick_cache = "0.6"

# Configuration and File Management
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
natord = "1.0"
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
